[zer0share]
data_dir = "../zer0share/data"   # zer0share 的 Parquet 数据目录

[paths]
factor_dir = "data/factors"
db_path    = "db/factor_meta.duckdb"
log_path   = "logs/factor.log"

[factor]
universe         = "all"              # 原始因子计算股票池
process_universe = "univ_trade_base"  # 标准化 / 中性化股票池
start_date       = "20160101"
end_date         = ""                 # 空 = 最新交易日

[web]
cache_dir       = "data/web_cache"      # 网页工作台派生缓存，可安全删除
evaluations_dir = "data/evaluations"
registry_path   = "config/factors.toml"
state_dir       = "data/workbench"      # 任务记录、任务日志、因子族状态（工作台写入）

[web.standard]          # 因子看板的"标准设定"
start_date  = "20160101"
quantiles   = 10
period      = "1D"
return_type = "open_t1"
universe    = "univ_trade_base"

[web.tasks]             # 后台任务并发上限
heavy_slots = 1         # 评估 / 构建
light_slots = 2         # 预热缓存
# python = "../zer0alpha/.venv/bin/python"  # 任务与因子族扫描用的解释器（空 = 服务自身）；
#                                            # 要构建 zer0alpha 的因子族，需指向能 import 它的 venv

[families]              # 自动发现因子族：扫描这些包下导出 FAMILY 的子模块
packages = ["zer0alpha.factors"]
